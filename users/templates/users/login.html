{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — InvSys</title>
  <link rel="stylesheet" href="{% static 'inventory/css/style.css' %}"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">Inv<span>Sys</span></div>
    <p class="auth-sub">Sign in to your account</p>

    {% if form.non_field_errors %}
      <div class="alert alert-error">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
        </svg>
        {{ form.non_field_errors.0 }}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
        <input type="text" id="{{ form.username.id_for_label }}" name="{{ form.username.html_name }}"
          class="form-control" placeholder="username" autofocus
          value="{{ form.username.value|default:'' }}"/>
        {% if form.username.errors %}<span class="form-error">{{ form.username.errors.0 }}</span>{% endif %}
      </div>

      <div class="form-group">
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        <div class="password-wrapper">
          <input type="password" id="{{ form.password.id_for_label }}" name="{{ form.password.html_name }}"
            class="form-control" placeholder="••••••••"/>
          <button type="button" class="pw-toggle" aria-label="Toggle password visibility" tabindex="-1">
            <!-- Eye icon (shown when password is hidden) -->
            <svg class="pw-icon-show" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <!-- Eye-off icon (shown when password is visible) -->
            <svg class="pw-icon-hide" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
        {% if form.password.errors %}<span class="form-error">{{ form.password.errors.0 }}</span>{% endif %}
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">
        Sign In
      </button>
    </form>

    <hr class="auth-divider"/>
  </div>
</div>

<style>
.password-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.password-wrapper .form-control {
  /* make room for the toggle button */
  padding-right: 42px;
  width: 100%;
}
.pw-toggle {
  position: absolute;
  right: 10px;
  background: none;
  border: none;
  padding: 4px;
  cursor: pointer;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: color 0.2s;
  line-height: 1;
}
.pw-toggle:hover { color: var(--text); }
.pw-toggle svg   { width: 18px; height: 18px; display: block; }
</style>

<script>
document.querySelectorAll('.pw-toggle').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var wrapper  = btn.closest('.password-wrapper');
    var input    = wrapper.querySelector('input');
    var iconShow = btn.querySelector('.pw-icon-show');
    var iconHide = btn.querySelector('.pw-icon-hide');

    if (input.type === 'password') {
      input.type       = 'text';
      iconShow.style.display = 'none';
      iconHide.style.display = 'block';
    } else {
      input.type       = 'password';
      iconShow.style.display = 'block';
      iconHide.style.display = 'none';
    }
  });
});
</script>

<script src="{% static 'inventory/js/script.js' %}"></script>
</body>
</html>
